[platformio]
default_envs = esp-wrover-kit

; Common settings for ESP32 envs
[common_esp]
build_flags =
    -D VERSION=1.2.3
    -D DEBUG=1

; Arduino 2.0.17 / ESP-IDF 4.4.7 uses the legacy ESP32 NeoPixel RMT driver.
platform = espressif32 @ 6.9.0
board = esp-wrover-kit
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv

framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
    tzapu/WiFiManager @ 2.0.17
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    bblanchon/ArduinoJson @ 7.4.3

src_filter = +<*> -<test/>

[env:esp-wrover-kit]
extends = common_esp
upload_protocol = espota
upload_port = 192.168.1.101
monitor_port = socket://192.168.1.101:8000
upload_flags =
    --port=3232
    --auth=esp32password

[env:esp-wrover-kit-usb]
extends = common_esp
upload_protocol = esptool
upload_speed = 115200

; Pin the release tag: an unqualified version can match a cached develop checkout.
[env:esp-wrover-kit-7_1_3]
extends = env:esp-wrover-kit
platform = https://github.com/platformio/platform-espressif32.git#v7.1.3

[env:native]
platform = native
build_flags =
    -D NATIVE_TEST
    -I test/mocks
    -std=c++11
    -D DEBUG=1
; Exclude firmware main and debugUdp (which depends on WiFi)
src_filter = +<*> -<main.cpp> -<debugUdp.cpp> +<../test/>
lib_deps =
    ; No external deps for native
